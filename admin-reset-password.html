<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="ampsiteslogo.png">
    <link rel="stylesheet" href="admin-login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-admin.js" defer></script>
    <script src="admin-login.js" defer></script>
    <title>Amplified Sites</title>
</head>
<body>
    <section class="amp-reset">
        <div class="amp-image">
            <img
                src="ampsites2.png"
                alt="Amplified Sites Logo"
            >
        </div>
        <form id="resetPasswordForm">
            <h2>Reset Password</h2>
            <p class="reset-description">
                Create a new password for your admin account.
            </p>
            <label for="newPassword">
                New Password
            </label>
            <input
                type="password"
                id="newPassword"
                name="newPassword"
                placeholder="New Password"
                autocomplete="new-password"
                required
            >
            <label for="confirmPassword">
                Confirm Password
            </label>
            <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Confirm Password"
                autocomplete="new-password"
                required
            >
            <div class="password-requirements">
                Password must be at least 8 characters.
            </div>
            <button
                type="submit"
                id="updatePasswordBtn"
            >
                Update Password
            </button>
            <div
                class="success"
                id="resetSuccess"
                style="display: none;"
            >
                Password updated successfully!
            </div>
            <div
                class="error"
                id="resetError"
                style="display: none;"
            >
                Passwords do not match.
            </div>
            <a
                href="admin-login.html"
                class="back-login"
            >
                ← Back to Admin Login
            </a>
        </form>
    </section>
</body>
</html>
