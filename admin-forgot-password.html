<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="ampsiteslogo.png">
    <link rel="stylesheet" href="admin-login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-admin.js" defer></script>
    <script src="admin-login.js" defer></script>
    <title>Amplified Sites</title>
</head>
<body>
    <section class="amp-forgot">      
        <div class="amp-image">
            <img src="ampsites2.png" alt="Amplified Sites Logo">
        </div>
        <form id="forgotPasswordForm">
            <h2>Forgot Password?</h2>
            <p class="forgot-description">
                Enter your admin email address and we'll send you a link to reset your password.
            </p>
            <input 
                type="email" 
                id="forgotEmail" 
                name="email"
                placeholder="Email"
                autocomplete="email"
                required>
            <button type="submit" id="resetBtn">
                Send Reset Link
            </button>
            <div class="success" id="successMessage">
                Reset link sent! Check your email.
            </div>
            <div class="error" id="forgotError">
                Unable to send reset link.
            </div>
            <a href="admin-login.html" class="back-login">
                ← Back to Admin Login
            </a>
        </form>
    </section>
</body>
</html>
